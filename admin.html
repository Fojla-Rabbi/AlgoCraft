<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoCraft Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{wine:'#5b0712',burgundy:'#760b18',gold:'#d9a441',cream:'#faf7f0',ink:'#211817'},fontFamily:{display:['Georgia','serif'],sans:['Inter','system-ui','sans-serif']}}}};</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <div id="adminApp" class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><div class="logo-mark"><span>A</span></div><div><b>ALGOCRAFT</b><small>COMPETITIVE PROGRAMMING</small></div></div>
      <div class="admin-user"><div class="admin-avatar">A</div><div><b>Admin</b><small>Administrator</small></div></div>
      <nav id="adminNav" class="admin-nav"></nav>
      <button id="adminLogout" class="admin-logout">↪ &nbsp; Logout</button>
    </aside>
    <main class="admin-main">
      <div class="admin-topbar"><div><p class="eyebrow">ALGOCRAFT ADMIN</p><h1 id="adminPageTitle">Overview</h1></div><button id="adminClose" class="admin-close" title="Back to website">×</button></div>
      <div id="adminContent"></div>
    </main>
  </div>

  <div id="editorModal" class="admin-modal hidden">
    <div class="admin-editor-card">
      <button id="editorClose" class="editor-close">×</button>
      <div id="editorBody"></div>
    </div>
  </div>
  <div id="adminToast" class="toast"></div>
  <script src="data.js"></script>
  <script src="content-store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
